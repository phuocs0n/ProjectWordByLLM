# Profile đo từ báo cáo đồ án môn học Khoa Điện tử - Viễn thông, ĐH KHTN (PDF "Nhom10"):
# A4, lề 2,54 cm, Times New Roman 13pt, giãn dòng 1,5, thụt đầu dòng 1 cm, tiêu đề đen,
# khung trang đôi xanh #1F3864 ở mọi trang, không in số trang, đánh số theo chương (1.1. / 2.5.1.),
# chú thích bảng in đậm phía trên, chú thích hình in nghiêng phía dưới, bảng tiêu đề xám #D9D9D9.
name: hcmus-fetel
extends: hcmus-clc
description: Báo cáo đồ án Khoa ĐT-VT HCMUS (A4, TNR 13pt, giãn dòng 1.5, đánh số theo chương)

page:
  size: a4
  margin_top_cm: 2.54
  margin_bottom_cm: 2.54
  margin_left_cm: 2.54
  margin_right_cm: 2.5
  cover_border: false
  border: {style: thickThinSmallGap, color: "1F3864", size: 24, space: 24, all_pages: true}  # khung đôi xanh mọi trang

body:
  size_pt: 13
  line_spacing: 1.5
  space_after_pt: 6
  first_line_indent_cm: 1.0

headings:
  color: "000000"
  front: {size_pt: 14, color: "000000", align: left}
  level1: {size_pt: 14, space_before_pt: 0, space_after_pt: 12}
  level2: {size_pt: 13, indent_cm: 0, space_before_pt: 10, space_after_pt: 4}
  level3: {size_pt: 13, indent_cm: 0, italic: false, color: "000000"}

header:
  left: ""
  right: ""

footer:
  page_number: none   # bản mẫu không in số trang

toc:
  bold_level1: false
  line_spacing: 1.5

table:
  header_fill: "D9D9D9"
  font_size_pt: 12
  body_align: left
  cell_padding_pt: 5   # hàng bảng thoáng như bản mẫu

caption:
  size_pt: 13
  italic: false
  separator: ". "
  table: {label_bold: true, bold_text: true, italic: false}      # "Bảng 2.1. …" đậm, phía trên bảng
  figure: {label_bold: false, label_italic: true, italic: true}  # "Hình 2.6. …" nghiêng, dưới hình
  code: {italic: true}                                           # "Mã nguồn 2.1. …" nghiêng, dưới khối code

code:
  size_pt: 11
  fill: "F2F2F2"
  border: box
  border_color: "BFBFBF"
  caption_position: below

cover_layout: banner
cover_show_faculty: true
cover_show_class: true
heading_numbering: chapter
references_numbered: false
divider_text: ""

labels:
  preface: LỜI NÓI ĐẦU
  members: "Sinh viên thực hiện"
  instructors: "Giảng viên hướng dẫn"
  subject: "Môn học"
  class: "Lớp"
  references: TÀI LIỆU THAM KHẢO
