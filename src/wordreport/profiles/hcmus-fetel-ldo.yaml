# Profile đo từ báo cáo "Thiết kế mạch Low Drop-Out Voltage Regulator" (Khoa ĐT-VT, HCMUS):
# Letter, lề 2,54 cm, Times New Roman 12pt giãn dòng 1.15, thụt đầu dòng 1,27 cm;
# tiêu đề "CHƯƠNG 1: …" đậm 16pt và mục "1.1. …" thường 14pt, cùng màu #0F4761;
# chú thích "Hình 1: …" / "Bảng 1: …" in đậm, đánh số liên tục cả bài, chú thích bảng nằm DƯỚI bảng;
# bìa có khung đôi đen, logo mờ sau tên đề tài; trang sau bìa đánh số từ 1 (Arial 11, giữa chân trang).
name: hcmus-fetel-ldo
extends: hcmus-clc
description: Báo cáo đồ án Khoa ĐT-VT HCMUS kiểu "CHƯƠNG 1:" (Letter, TNR 12pt, tiêu đề xanh #0F4761)

page:
  size: letter
  margin_top_cm: 2.54
  margin_bottom_cm: 2.54
  margin_left_cm: 2.54
  margin_right_cm: 2.54
  cover_border: false
  border: {style: thinThickSmallGap, color: "000000", size: 24, space: 20, all_pages: false}
  number_from_front: true

body:
  size_pt: 12
  line_spacing: 1.15
  space_after_pt: 10
  first_line_indent_cm: 1.27

headings:
  color: "0F4761"
  level1_format: "CHƯƠNG {n}:"
  front: {size_pt: 16, color: "0F4761", align: left}
  level1: {size_pt: 16, bold: true, space_before_pt: 0, space_after_pt: 8}
  level2: {size_pt: 14, bold: false, indent_cm: 0, space_before_pt: 10, space_after_pt: 8}
  level3: {size_pt: 13, bold: false, italic: false, indent_cm: 0, color: "0F4761"}

header:
  left: ""
  right: ""

footer:
  page_number: center
  font: Arial
  size_pt: 11
  border_top: false

toc:
  title: {size_pt: 26, align: center, color: "000000"}
  include_self: false   # mục lục không liệt kê chính dòng "MỤC LỤC"
  size_pt: 11
  bold_level1: true
  line_spacing: 1.15

table:
  header_fill: ""
  font_size_pt: 12
  body_align: center
  width_cm: 13
  cell_padding_pt: 0

caption:
  size_pt: 12
  italic: false
  separator: ": "
  table_position: below
  table: {label_bold: true, bold_text: true, italic: false}
  figure: {label_bold: true, bold_text: true, italic: false}
  code: {italic: false}

code:
  size_pt: 10
  fill: "F2F2F2"
  border: box
  border_color: "BFBFBF"
  caption_position: below

cover_layout: title_block
cover:
  divider: "---❧❦☙---"
  logo_col_cm: 6.4
  logo_width_cm: 5.9
  header_size_pt: 13
  title_size_pt: 36
  members_size_pt: 14
  members_widths: [1, 6, 3]
  place_bold: true

heading_numbering: chapter
caption_numbering: global
references_numbered: false
references_style: number
divider_text: ""

labels:
  toc: MỤC LỤC
  references: TÀI LIỆU THAM KHẢO
