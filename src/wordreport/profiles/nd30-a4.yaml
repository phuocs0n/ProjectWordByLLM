# Profile văn bản hành chính / báo cáo doanh nghiệp khổ A4 theo tinh thần Nghị định 30/2020/NĐ-CP:
# lề trái 3cm, phải 2cm, trên/dưới 2cm, Times New Roman 13pt, giãn dòng 1.3.
# Chỉ khai báo phần khác với profile gốc - phần còn lại kế thừa qua `extends`.
name: nd30-a4
extends: hcmus-clc
description: Báo cáo doanh nghiệp/hành chính khổ A4 (lề 3-2-2-2 cm, TNR 13pt, giãn dòng 1.3)

page:
  size: a4
  margin_top_cm: 2.0
  margin_bottom_cm: 2.0
  margin_left_cm: 3.0
  margin_right_cm: 2.0
  cover_border: false

body:
  size_pt: 13
  line_spacing: 1.3
  first_line_indent_cm: 1.0

headings:
  color: "000000"
  level1: {size_pt: 13}
  level2: {size_pt: 13}
  level3: {size_pt: 13, italic: true, color: "000000"}

table:
  header_fill: "D9E2F3"
  font_size_pt: 12
