[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordreport"
version = "0.1.0"
description = "Tự động soạn thảo & định dạng báo cáo Microsoft Word (.docx) chuyên nghiệp bằng LLM + MCP + kho skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "mcp>=2.0",
  "anthropic[mcp]>=1.8",
]

[project.optional-dependencies]
markitdown = ["markitdown[all]>=0.1"]
dev = ["pytest>=8"]

[project.scripts]
wordreport = "wordreport.cli:main"
wordreport-mcp = "wordreport.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wordreport = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
